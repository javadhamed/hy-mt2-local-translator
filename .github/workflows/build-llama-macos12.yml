name: Build llama.cpp for macOS 12 (Hy-MT2 1.25-bit support)

on:
  workflow_dispatch:
    inputs:
      llama_branch:
        description: 'llama.cpp branch/tag'
        required: true
        default: 'master'
        type: choice
        options: [master, b5000, b4000, b3000]

jobs:
  build-macos-x64:
    name: Build macOS x64 (target 12.0)
    runs-on: macos-13
    timeout-minutes: 45
    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggerganov/llama.cpp
          ref: ${{ github.event.inputs.llama_branch }}
          path: llama.cpp

      - name: Install OpenBLAS
        run: brew install openblas

      - name: Configure CMake (static OpenBLAS, target macOS 12)
        working-directory: llama.cpp
        run: |
          cmake -B build \
            -DGGML_BLAS=ON \
            -DGGML_BLAS_VENDOR=OpenBLAS \
            -DOpenBLAS_ROOT=/usr/local/opt/openblas \
            -DGGML_METAL=OFF \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_C_FLAGS="-mmacosx-version-min=12.0" \
            -DCMAKE_CXX_FLAGS="-mmacosx-version-min=12.0" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,-dead_strip -L/usr/local/opt/openblas/lib" \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_CLI=ON

      - name: Build llama-server and llama-cli
        working-directory: llama.cpp
        run: |
          cmake --build build -j$(sysctl -n hw.ncpu) --target llama-server llama-cli

      - name: Verify binaries
        working-directory: llama.cpp
        run: |
          file build/bin/llama-server build/bin/llama-cli
          if nm -arch x86_64 build/bin/llama-server | grep -q "cblas_sgemm.*NEWLAPACK.*ILP64"; then
            echo "⚠️ WARNING: Found macOS 13+ symbol in binary"
          else
            echo "✅ No macOS 13+ Accelerate symbols detected"
          fi
          otool -L build/bin/llama-server

      - name: Test model loading (quick)
        working-directory: llama.cpp
        run: |
          curl -sL "https://huggingface.co/ggml-org/ggml-tiny/resolve/main/ggml-tiny-q4_0.gguf" -o /tmp/test.gguf
          timeout 30 ./build/bin/llama-server -m /tmp/test.gguf -c 512 --port 8081 & sleep 5 && curl -s http://localhost:8081/health && pkill llama-server || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-macos12-x64-${{ github.event.inputs.llama_branch }}
          path: |
            llama.cpp/build/bin/llama-server
            llama.cpp/build/bin/llama-cli
          retention-days: 30

  build-macos-arm64:
    name: Build macOS arm64 (target 12.0)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggerganov/llama.cpp
          ref: ${{ github.event.inputs.llama_branch }}
          path: llama.cpp

      - name: Configure CMake (use Accelerate framework, target macOS 12)
        working-directory: llama.cpp
        run: |
          cmake -B build \
            -DGGML_BLAS=OFF \
            -DGGML_METAL=ON \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_C_FLAGS="-mmacosx-version-min=12.0" \
            -DCMAKE_CXX_FLAGS="-mmacosx-version-min=12.0" \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_CLI=ON

      - name: Build llama-server and llama-cli
        working-directory: llama.cpp
        run: |
          cmake --build build -j$(sysctl -n hw.ncpu) --target llama-server llama-cli

      - name: Verify binaries
        working-directory: llama.cpp
        run: |
          file build/bin/llama-server build/bin/llama-cli
          otool -L build/bin/llama-server

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-macos12-arm64-${{ github.event.inputs.llama_branch }}
          path: |
            llama.cpp/build/bin/llama-server
            llama.cpp/build/bin/llama-cli
          retention-days: 30
